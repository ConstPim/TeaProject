  <div class="card text-start">
    <img src="{{product.image}}" class="card-img-top img-fluid" alt="image1">
    <div class="card-body">
      <div>
        <h5 class="card-title">{{product.title}}</h5>
        <p class="card-text text-start">{{product.description}}</p>
      </div>
      <a [routerLink]="['/product', product.id]" class="btn btn-primary w-btn mt-3">Подробнее</a>
    </div>
  </div>
